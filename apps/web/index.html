<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- Primary SEO -->
    <title>Prims — Compose with AI</title>
    <meta
      name="description"
      content="Prims is a self-hostable, collaborative LaTeX editor. Write, compile, and review papers together in real time, with live presence, version history, and a built-in PDF preview."
    />
    <meta
      name="keywords"
      content="LaTeX, LaTeX editor, collaborative LaTeX, Overleaf alternative, self-hosted LaTeX, real-time LaTeX, academic writing, BibTeX, PDF, Tectonic, pandoc"
    />
    <meta name="author" content="Scribe" />
    <meta name="application-name" content="Prims" />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="light dark" />

    <!-- Icons (SVG scales for every density; theme-aware via media attrs in the file itself) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=pen-20261028" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=pen-20261028" />
    <link rel="mask-icon" href="/pen-mask.svg?v=pen-20261028" color="#000000" />

    <!-- Open Graph (LinkedIn, Slack, Facebook, …) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prims" />
    <meta property="og:title" content="Prims — Compose with AI" />
    <meta
      property="og:description"
      content="Self-hostable, collaborative LaTeX editor with live presence, version history, and a built-in PDF preview."
    />
    <meta property="og:image" content="/favicon.svg?v=pen-20261028" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:alt" content="Prims logo" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Prims — Compose with AI" />
    <meta
      name="twitter:description"
      content="Self-hostable, collaborative LaTeX editor with live presence and a built-in PDF preview."
    />
    <meta name="twitter:image" content="/favicon.svg?v=pen-20261028" />

    <!-- Progressive-web-app touches (no manifest yet, but tag for iOS standalone).
         `mobile-web-app-capable` is the standardised name; the Apple-prefixed
         variant is now deprecated. Ship both so older iOS versions still
         honour the Apple-prefixed one. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Prims" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
